name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" > /dev/null
      - name: Release signing (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.DEWFIELD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DEWFIELD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DEWFIELD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DEWFIELD_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            {
              echo "DEWFIELD_KEYSTORE=$RUNNER_TEMP/release.jks"
              echo "DEWFIELD_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "DEWFIELD_KEY_ALIAS=$KEY_ALIAS"
              echo "DEWFIELD_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "SIGNED_WITH=release key" >> "$GITHUB_ENV"
          else
            echo "SIGNED_WITH=debug key (no release key configured)" >> "$GITHUB_ENV"
          fi
      - name: Test and assemble
        run: ./gradlew :core:test :android:assembleRelease --stacktrace
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp android/build/outputs/apk/release/*.apk "dist/dewfield-$version.apk"
          gh release create "$GITHUB_REF_NAME" "dist/dewfield-$version.apk" \
            --title "Dewfield $version" \
            --generate-notes \
            --notes "APK signed with the $SIGNED_WITH. Install: download the APK on your phone and open it (allow installs from your browser or file manager)."
