name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Leave the Android module out: the rules and world tests don't need it.
      ANDROID_HOME: ""
      ANDROID_SDK_ROOT: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check generated strings are up to date
        run: |
          python3 tools/i18n/strings.py
          git diff --exit-code -- assets/i18n || (echo "::error::Run python3 tools/i18n/strings.py and commit the result" && exit 1)
      - name: Test
        run: ./gradlew :core:test :desktop:compileKotlin --stacktrace
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: core/build/reports/tests/

  android:
    name: Build APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" > /dev/null
      - name: Release signing (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.DEWFIELD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DEWFIELD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DEWFIELD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DEWFIELD_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            {
              echo "DEWFIELD_KEYSTORE=$RUNNER_TEMP/release.jks"
              echo "DEWFIELD_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "DEWFIELD_KEY_ALIAS=$KEY_ALIAS"
              echo "DEWFIELD_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Signing with the release key"
          else
            echo "::notice::No release key configured, the APK is signed with the debug key"
          fi
      - name: Assemble release APK
        run: ./gradlew :android:assembleRelease --stacktrace
      - name: Name the APK
        id: apk
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' android/build.gradle.kts)
          mkdir -p dist
          cp android/build/outputs/apk/release/*.apk "dist/dewfield-$version.apk"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dewfield-apk
          path: dist/*.apk
          if-no-files-found: error

  smoke:
    name: Emulator smoke test
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dewfield-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/smoke-test.sh apk
      - name: Upload screenshots and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test
          path: smoke/
          if-no-files-found: ignore
